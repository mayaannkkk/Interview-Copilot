[project]
name = "agentic-interview-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mayaannkkk", email = "goyalmayank492@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
agentic-interview-coach = "agentic_interview_coach:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
extraPaths = ["."]

